[project]
name = "mtg-vendor"
version = "0.1.0"
description = "Mettre en vente sur Cardmarket une collection Magic exportée depuis Moxfield"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mtg-vendor = "mtg_vendor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mtg_vendor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
